services:
  app:
    build:
      context: .
      dockerfile: src/MahjongTutor.Server/Dockerfile
    ports:
      # Bound on all interfaces so other machines on the LAN can reach it:
      #   http://<host-LAN-IP>:8420  (override with APP_PORT)
      - "${APP_PORT:-8420}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=mahjongtutor;Username=mahjong;Password=${POSTGRES_PASSWORD:-mahjong}
      Seq__ServerUrl: http://seq:5341
      Otel__Endpoint: http://jaeger:4317
      TILESET_DIR: /app/user-tiles
      Ollama__Url: http://ollama:11434
      Ollama__Model: ${OLLAMA_MODEL:-llama3.2}
      Piper__Url: http://piper:5000
    volumes:
      - tilesets:/app/user-tiles
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
      jaeger:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mahjongtutor
      POSTGRES_USER: mahjong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mahjong}
    ports:
      # Exposed for `dotnet ef` migrations and DB tools during development.
      # Nonstandard host port avoids colliding with any local Postgres install.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahjong -d mahjongtutor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Structured log UI: http://localhost:5341
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seqdata:/data
    restart: unless-stopped

  # Trace UI: http://localhost:16686  (app sends OTLP gRPC to jaeger:4317)
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # query UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    restart: unless-stopped

  # Optional local LLM for "Ask coach" — opt-in profile:
  #   docker compose --profile ai up -d
  #   docker exec -it mahjongtutor-ollama-1 ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # Optional Piper TTS for spoken advice — same 'ai' profile:
  #   docker compose --profile ai up -d
  # soothing female voice: en_US-amy-medium (downloads on first use)
  piper:
    image: python:3.11-slim
    profiles: ["ai"]
    command: >
      sh -c "pip install --quiet piper-tts &&
             python -m piper.http_server --host 0.0.0.0 --port 5000
             -m ${PIPER_VOICE:-en_US-amy-medium} --data-dir /models"
    volumes:
      - pipermodels:/models
    ports:
      - "5001:5000"
    restart: unless-stopped

volumes:
  pgdata:
  seqdata:
  tilesets:
  ollama:
  pipermodels:
